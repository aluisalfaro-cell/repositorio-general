<html>
<head>
<title>Turismo del Perú</title>
<style>
*{
    padding: 0px;
    margin: 0px;
}
body{
    font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;

    background:
    linear-gradient(
        rgba(0,0,0,0.65),
        rgba(0,0,0,0.65)
    ),
    url("img/fondo_archivos.gif");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    color: white;

    padding: 40px;
}
.contenedor{
    width: 800px;
    height: 300px;
    border: 1px solid black;
    margin: 0 auto;
    position: relative;
    overflow: hidden;
}
.tarjeta1, .tarjeta2, .tarjeta3, .tarjeta4{
    width: 200px;
    height: 300px;
    position: absolute;
    top: -300px;
    background-size: cover;

}
.tarjeta1{
    background-image: url(img/tarjeta1.jpg);
    left: 0px;
    animation: tarjeta1 3s 1 forwards ;
}
.tarjeta2{
    background-image: url(img/tarjeta2.jpg);
    left: 200px;
    top: -300px;
    animation: tarjeta2 3s 1 forwards 3s;
}
.tarjeta3{
    background-image: url(img/tarjeta3.jpg);
    left: 400px;
    top: -300px;
    animation: tarjeta3 3s 1 forwards 6s;
}
.tarjeta4{
    background-image: url(img/tarjeta4.jpg);
    left: 600px;
    top: -300px;
    animation: tarjeta4 3s 1 forwards 9s;
}

/*Las Ricas Animaciones*/
@keyframes tarjeta1{
    0%{
        top: -300px;
        transform: rotateY(180deg);
    }
    50%{
        top: 300px;
    }
    100%{
        top: 0px;
    }
}
@keyframes tarjeta2{
    0%{
        top: -300px;
        transform: rotateY(180deg);
    }
    50%{
        top: 300px;
    }
    100%{
        top: 0px;
    }
}
@keyframes tarjeta3{
    0%{
        top: -300px;
        transform: rotateY(180deg);
    }
    50%{
        top: 300px;
    }
    100%{
        top: 0px;
    }
}
@keyframes tarjeta4{
    0%{
        top: -300px;
        transform: rotateY(180deg);
    }
    50%{
        top: 300px;
    }
    100%{
        top: 0px;
    }
}

/*EVENTOS*/
.tarjeta1:hover{
    transition: 1s;
    scale: 1.2;
    z-index: 1;
}
.tarjeta2:hover{
    transition: 1s;
    scale: 1.2;
    z-index: 1;
}
.tarjeta3:hover{
    transition: 1s;
    scale: 1.2;
    z-index: 1;
}
.tarjeta4:hover{
    transition: 1s;
    scale: 1.2;
    z-index: 1;
}

.volver{
    display: inline-block;
    padding: 10px 20px;
    background: #224c54;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    transition: 0.3s;
}

</style>
</head>
<body>
<div class="contenedor">
    <div class="tarjeta1"></div>
    <div class="tarjeta2"></div>
    <div class="tarjeta3"></div>
    <div class="tarjeta4"></div>
</div>
<audio autoplay loop>
    <source src="../audio/musica.mp3" type="audio/mpeg">
</audio>

<a href="../index.html" class="volver">Volver al Inicio</a>


</body>
</html>
