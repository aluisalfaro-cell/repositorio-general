<html>
<head>
    <title>Cohete Espacial</title>
    <style>
    *{
        margin:0;
        padding:0;
    }
    
    body{
        
            
    font-family: "Century Gothic", CenturyGothic, AppleGothic, sans-serif;

    background:
    linear-gradient(
        rgba(0,0,0,0.65),
        rgba(0,0,0,0.65)
    ),
    url("img/fondo_archivos.gif");

    background-size: cover;
    background-position: center;
    background-attachment: fixed;

    color: white;

    padding: 40px;
    }

    #contenedor{
        width: 400px;
        height: 200px;
        border: 1px solid black;
        position:relative;
        margin:0 auto;
        overflow: hidden;
        background: black;
    }


    #contenedor::before{
        content: "";
        position: absolute;
        width: 200%;
        height: 200%;
        top: -20%;
        left: -50%;

        background-image:
            radial-gradient(white 1px, transparent 1px),
            radial-gradient(white 2px, transparent 2px),
            radial-gradient(white 1.5px, transparent 1.5px);

        background-size: 
            60px 60px,
            100px 100px,
            80px 80px;

        background-position:
            0 0,
            50px 50px,
            70px 40px;

        animation: estrellas  2s linear infinite;
    }

    @keyframes estrellas{
        from{
            transform: translate(0, 0);
        }
        to{
            transform: translate(-60px, 60px);
        }
    }

    #cohete{
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        z-index: 1;
    }

    #cohete img{
        width: 120px;
        transform: rotate(-25deg); /* inclinación */
        display: block;
    }
    
    .volver{
    display: inline-block;
    padding: 10px 20px;
    background: #224c54;
    color: white;
    text-decoration: none;
    border-radius: 8px;
    transition: 0.3s;
}

    </style>
</head>
<body>

    <div id="contenedor">

       
        <div id="cohete">
            <img src="img/cohete.gif">
        </div>

    </div>
<audio autoplay loop>
    <source src="../audio/musica.mp3" type="audio/mpeg">
</audio>

    <a href="../ANIMACION 4/index.html" class="volver">Volver al Inicio</a>

</body>
</html>
